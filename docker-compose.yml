version: "3.8"
services:
  db:
    image: postgres:14
    environment:
      - POSTGRES_USER=losky
      - POSTGRES_PASSWORD=losky_pass
      - POSTGRES_DB=loskydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
  backend:
    build: ./backend
    env_file:
      - ./backend/.env.example
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  pgdata: